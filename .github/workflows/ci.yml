name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - name: Package and publint
        run: npm run package
      - name: List the files npm would publish
        run: npm pack --dry-run

  svelte-floor:
    name: Oldest supported Svelte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the lowest Svelte the peer range allows
        run: |
          min=$(node -p "require('./package.json').peerDependencies.svelte.replace(/^[\^~]/, '')")
          npm install --prefix "$RUNNER_TEMP/svelte-floor" --no-save --no-package-lock --ignore-scripts "svelte@$min"
      - name: Compile the components and resolve their imports with it
        run: node scripts/check-svelte-compat.mjs "$RUNNER_TEMP/svelte-floor/node_modules/svelte"
